<!-- ═══════════════════════════════════════════
     Add User Modal
     ═══════════════════════════════════════════ -->
<div class="modal fade" id="addUserModal" tabindex="-1" aria-labelledby="addUserModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content settings-modal">
            <div class="modal-header border-0 pb-0 d-flex align-items-center justify-content-between w-100">
                <h5 class="modal-title fw-bold mb-0" id="addUserModalLabel">
                    <i class="bi bi-person-plus me-2" style="color: var(--accent-color);"></i>Create User Account
                </h5>
                <button type="button" class="btn-close ms-0 me-auto m-0" data-bs-dismiss="modal"
                    aria-label="Close"></button>
            </div>
            <form method="POST" action="{{ url_for('settings.add_user') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body py-4">
                    <div class="mb-3">
                        <label for="add_username" class="settings-label">Username</label>
                        <input type="text" class="form-control settings-input" id="add_username" name="username"
                            required placeholder="Enter username">
                    </div>
                    <div class="mb-3">
                        <label for="add_password" class="settings-label">Password</label>
                        <input type="password" class="form-control settings-input" id="add_password" name="password"
                            required placeholder="Enter password">
                    </div>
                    <div class="row g-2 mb-3">
                        <div class="col-md-6">
                            <label for="add_first_name" class="settings-label">First Name</label>
                            <input type="text" class="form-control settings-input" id="add_first_name" name="first_name"
                                placeholder="First name">
                        </div>
                        <div class="col-md-6">
                            <label for="add_last_name" class="settings-label">Last Name</label>
                            <input type="text" class="form-control settings-input" id="add_last_name" name="last_name"
                                placeholder="Last name">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="add_role" class="settings-label">System Role</label>
                        <select class="form-select settings-input" id="add_role" name="role">
                            <option value="receptionist">Receptionist</option>
                            <option value="doctor">Doctor</option>
                            <option value="admin">Admin</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-outline-secondary rounded-pill px-3"
                        data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4">Create Account</button>
                </div>
            </form>
        </div>
    </div>
</div>
