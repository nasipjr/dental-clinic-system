<!-- ═══════════ Patients Filter & Search Bar ═══════════ -->
<form id="patients-filter-form" method="GET" action="{{ url_for('patients.patients_table') }}" class="appointments-filter-bar mb-4">
    <div class="row gy-3 align-items-end">

        <!-- Search Input -->
        <div class="col-md-6">
            <label class="form-label fw-semibold">{% if current_lang == 'ar' %}البحث في ملفات المرضى{% else %}Search Patient{% endif %}</label>
            <input type="text" name="search" class="form-control" placeholder="{% if current_lang == 'ar' %}الاسم، الهاتف، البريد، أو العنوان والمدينة...{% else %}Name, phone, email, or city{% endif %}"
                value="{{ search_query }}">
        </div>

        <input type="hidden" name="sort" value="{{ sort_by }}">
        <input type="hidden" name="order" value="{{ order }}">
        <input type="hidden" name="per_page" id="patient-per-page-input" value="{{ per_page or 10 }}">

        <!-- Filter Actions & Per-Page Controls -->
        <div class="col-md-6 d-flex gap-2 flex-wrap align-items-center">
            <button type="submit" class="btn btn-filter-search">
                <i class="bi bi-funnel"></i>
                <span>{% if current_lang == 'ar' %}تطبيق البحث{% else %}Apply Search{% endif %}</span>
            </button>
            
            <a href="{{ url_for('patients.patients') }}" class="btn btn-filter-reset">
                <i class="bi bi-arrow-counterclockwise"></i>
                <span>{% if current_lang == 'ar' %}إعادة تعيين{% else %}Reset{% endif %}</span>
            </a>

            <div class="table-per-page-wrapper ms-auto">
                <label for="patients-per-page-select-top" class="table-per-page-label">{% if current_lang == 'ar' %}عرض في الصفحة:{% else %}Items per page:{% endif %}</label>
                <select id="patients-per-page-select-top" class="table-per-page-select" onchange="changeTablePerPage(this.value, 'patients')">
                    <option value="5" {% if per_page == 5 %}selected{% endif %}>5</option>
                    <option value="10" {% if per_page == 10 or not per_page %}selected{% endif %}>10</option>
                    <option value="25" {% if per_page == 25 %}selected{% endif %}>25</option>
                    <option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
                    <option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
                </select>
            </div>
        </div>

    </div>
</form>
