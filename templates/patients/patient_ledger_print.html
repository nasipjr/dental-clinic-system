<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{% if current_lang == 'ar' %}rtl{% else %}ltr{% endif %}">
<head>
    <meta charset="UTF-8">
    <title>{% if current_lang == 'ar' %}السجل المالي - {{ patient.first_name }} {{ patient.last_name }}{% else %}Financial Ledger - {{ patient.first_name }} {{ patient.last_name }}{% endif %}</title>
    
    <!-- Fonts & Bootstrap -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/patient_ledger_print.css') }}">
</head>
<body class="ledger-print-layout">

    <!-- Header Actions, Letterhead & Patient Details -->
    {% include "patients/sections/_section_ledger_header.html" %}

    <!-- Financial Ledger Transactions Table -->
    {% include "patients/sections/_section_ledger_table.html" %}

    <!-- Summary Balance Box -->
    {% include "patients/sections/_section_ledger_summary.html" %}

    <!-- Auto-Print Trigger -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                window.print();
            }, 500);
        });
    </script>
</body>
</html>
