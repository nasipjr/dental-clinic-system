<!-- ═══════════ Payments Filters & Live Search ═══════════ -->
<div class="appointments-table-wrapper mb-4">
    <form id="payments-filter-form" method="GET" action="{{ url_for('payments.payments_table') }}">
        <div class="row gy-3 align-items-end">

            <div class="col-lg-7 col-md-8">
                <label for="search" class="form-label">{% if current_lang == 'ar' %}بحث في المدفوعات{% else %}Search Payments{% endif %}</label>
                <input
                    type="text"
                    id="search"
                    name="search"
                    class="form-control"
                    placeholder="{% if current_lang == 'ar' %}ابحث باسم المريض، رقم الهاتف، رقم الدفعة، التاريخ، المبلغ، أو الملاحظات{% else %}Search by patient, phone, payment number, date, amount, or notes{% endif %}"
                    value="{{ search_query }}"
                >
            </div>

            <input type="hidden" name="sort" value="{{ sort_by }}">
            <input type="hidden" name="order" value="{{ order }}">
            <input type="hidden" name="per_page" id="payments-per-page-input" value="{{ per_page or 10 }}">

            <div class="col-lg-5 col-md-4 d-flex gap-2 flex-wrap align-items-center">
                <button type="submit" class="btn btn-primary">
                    <i class="bi bi-search me-1"></i>
                    {% if current_lang == 'ar' %}بحث{% else %}Search{% endif %}
                </button>

                <a href="{{ url_for('payments.payments') }}" class="btn btn-outline-secondary reset-filter-btn">
                    {% if current_lang == 'ar' %}إعادة تعيين{% else %}Reset{% endif %}
                </a>

                <div class="d-flex align-items-center gap-2 ms-auto">
                    <label for="payments-per-page-select-top" class="small text-muted mb-0 fw-semibold text-nowrap">{% if current_lang == 'ar' %}عرض في الصفحة:{% else %}Items per page:{% endif %}</label>
                    <select id="payments-per-page-select-top" class="form-select form-select-sm border-secondary-subtle rounded-3 py-1.5 shadow-xs" style="width: auto;" onchange="changeTablePerPage(this.value, 'payments')">
                        <option value="5" {% if per_page == 5 %}selected{% endif %}>5</option>
                        <option value="10" {% if per_page == 10 or not per_page %}selected{% endif %}>10</option>
                        <option value="25" {% if per_page == 25 %}selected{% endif %}>25</option>
                        <option value="50" {% if per_page == 50 %}selected{% endif %}>50</option>
                        <option value="100" {% if per_page == 100 %}selected{% endif %}>100</option>
                    </select>
                </div>
            </div>

        </div>
    </form>
</div>
