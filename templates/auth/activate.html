{% set current_lang = session.get('lang', 'ar') %}
<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{{ 'rtl' if current_lang == 'ar' else 'ltr' }}" data-bs-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if current_lang == 'ar' %}تفعيل ترخيص النظام — عيادة الأسنان{% else %}System License Activation — Dental Clinic MS{% endif %}</title>

    <!-- Fonts & Vendor CSS Files -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth_activate.css') }}" rel="stylesheet">
</head>

<body class="activation-layout">
    <div class="activation-card">
        <!-- Activation Header, Lock Icon & Alerts -->
        {% include "auth/sections/_section_activate_header.html" %}

        <div class="p-4 p-md-5">
            <!-- Machine HWID, Activation Form & Support -->
            {% include "auth/sections/_section_activate_form.html" %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='js/auth_activate_core.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.initAuthActivate({
                currentLang: {{ current_lang | tojson }}
            });
        });
    </script>
</body>

</html>
