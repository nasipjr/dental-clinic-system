{% set current_lang = request.cookies.get('lang', 'ar') %}
<!DOCTYPE html>
<html lang="{{ current_lang }}" dir="{% if current_lang == 'ar' %}rtl{% else %}ltr{% endif %}">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>{% if current_lang == 'ar' %}تسجيل الدخول - {{ clinic_name }}{% else %}Login - {{ clinic_name }}{% endif %}</title>

    <!-- Favicons -->
    <link href="{{ url_for('static', filename='assets/img/favicon.png') }}" rel="icon">

    <!-- Fonts & Vendor CSS Files -->
    <link href="https://fonts.googleapis.com" rel="preconnect">
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/vendor/bootstrap/css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/vendor/bootstrap-icons/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='assets/css/main.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='styles.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/auth_login.css') }}" rel="stylesheet">
</head>

<body class="login-layout">
    <div class="login-container">
        <div class="login-card">
            <!-- Header, Logo & Alerts -->
            {% include "auth/sections/_section_login_header.html" %}

            <!-- Login Tabs (Staff vs Patient) -->
            {% include "auth/sections/_section_login_tabs.html" %}
        </div>
    </div>

    <!-- Scripts -->
    <script src="{{ url_for('static', filename='assets/vendor/bootstrap/js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/auth_login_core.js') }}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            window.initAuthLogin({
                currentLang: {{ current_lang | tojson }}
            });
        });
    </script>
</body>

</html>
