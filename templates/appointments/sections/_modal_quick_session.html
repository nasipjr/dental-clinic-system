<!-- ═══════════ Quick Session Start Modal ═══════════ -->
<div class="modal fade" id="quickSessionModal" tabindex="-1" aria-labelledby="quickSessionModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow-lg" style="background: var(--surface-color); color: var(--default-color);">
            <div class="modal-header border-bottom-0 pb-0">
                <h5 class="modal-title fw-bold text-success d-flex align-items-center gap-2" id="quickSessionModalLabel">
                    <i class="bi bi-lightning-charge-fill text-success fs-4"></i>
                    {% if current_lang == 'ar' %}بدء جلسة جديدة سريعة الآن{% else %}Start Quick New Session{% endif %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="{{ url_for('appointments.quick_session_start') }}" method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body py-3">
                    <p class="text-muted small mb-3">
                        {% if current_lang == 'ar' %}اختر المريض لبدء جلسة علاجية فورية بتاريخ وساعة اللحظة الحالية:{% else %}Select a patient to start an immediate clinical session now:{% endif %}
                    </p>
                    <div class="mb-3">
                        <label for="quick-session-patient-select" class="form-label fw-bold small">{% if current_lang == 'ar' %}المريض{% else %}Patient{% endif %}</label>
                        <select name="patient_id" id="quick-session-patient-select" class="form-select rounded-3 py-2 fw-semibold" required>
                            <option value="">{% if current_lang == 'ar' %}جاري تحميل قائمة المرضى...{% else %}Loading patients list...{% endif %}</option>
                        </select>
                    </div>
                </div>
                <div class="modal-footer border-top-0 pt-2 gap-2">
                    <button type="button" class="btn-modal-cancel" data-bs-dismiss="modal">
                        <i class="bi bi-x-lg"></i>
                        <span>{% if current_lang == 'ar' %}إلغاء{% else %}Cancel{% endif %}</span>
                    </button>
                    <button type="submit" class="btn-modal-submit-success">
                        <i class="bi bi-lightning-charge-fill"></i>
                        <span>{% if current_lang == 'ar' %}بدء الجلسة فوراً{% else %}Start Session Now{% endif %}</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
