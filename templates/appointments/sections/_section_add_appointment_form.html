<!-- ═══════════ Add Appointment Main Form ═══════════ -->
<form id="add-patient-form" method="POST" data-aos="fade-up" data-aos-delay="300">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') or request.referrer or '' }}">

    <div class="row gy-4">

        <!-- Patient Selection (if listing multiple patients) -->
        {% if patients %}
        <div class="col-md-12">
            <label for="patient_id" class="form-label">{% if current_lang == 'ar' %}المريض{% else %}Patient{% endif %}</label>
            <select id="patient_id" name="patient_id" class="form-select" required>
                <option value="">{% if current_lang == 'ar' %}اختر المريض...{% else %}Select a Patient...{% endif %}</option>
                {% for p in patients %}
                <option value="{{ p.id }}">{{ p.first_name }} {{ p.last_name }} ({{ p.phone or ('لا يوجد هاتف' if current_lang == 'ar' else 'No phone') }})</option>
                {% endfor %}
            </select>
        </div>
        {% endif %}

        <!-- Appointment Date & Time -->
        <div class="col-md-12">
            <label for="appointment_date" class="form-label">{% if current_lang == 'ar' %}تاريخ ووقت الموعد{% else %}Date & Time Of Appointment{% endif %}</label>
            <input type="datetime-local" id="appointment_date" name="appointment_date"
                class="form-control" min="{{ appointment_min_datetime }}"
                max="{{ appointment_max_datetime }}" value="{{ prefilled_date }}"
                data-working-days="{{ working_days }}" data-min-time="{{ working_hours_start }}"
                data-max-time="{{ working_hours_end }}"
                data-duration="{{ default_appointment_duration }}" required>
        </div>

        <!-- Reason & Procedure Category Selection -->
        <div class="col-md-12">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-2.5 flex-wrap gap-2">
                    <label for="reason" class="form-label fw-bold fs-6 mb-0 d-flex align-items-center gap-2 text-primary">
                        <i class="bi bi-layers-half fs-5 text-primary"></i>
                        {% if current_lang == 'ar' %}السبب وتصنيف المعالجة الطبية{% else %}Reason & Procedure Category{% endif %}
                    </label>
                    <button type="button" class="btn btn-custom-procedure-toggle" onclick="toggleCustomReasonInput()">
                        <i class="bi bi-plus-circle-dotted"></i>
                        <span>{% if current_lang == 'ar' %}إضافة سبب / إجراء نصي مخصص غير مدرج{% else %}Add Custom / Unlisted Procedure{% endif %}</span>
                    </button>
                </div>

                <!-- Primary Standard Categorized Procedure Select -->
                <select id="reason" name="reason" class="form-select custom-reason-select mb-1" onchange="handleReasonChange(this)" required>
                    <option value="">{% if current_lang == 'ar' %}-- اختر نوع الإجراء أو سبب الموعد من القائمة --{% else %}-- Select Procedure or Reason --{% endif %}</option>
                    {% set details_map = treatment_details if treatment_details else {} %}
                    {% set defined_cats = ['فحص وتشخيص', 'حشوات ومعالجات تجميلية', 'علاج عصب وجذور', 'جراحة وقلع', 'تعويضات وتيجان', 'تقويم أسنان', 'أسنان أطفال', 'إجراءات عامة وأخرى'] %}
                    {% for cat in defined_cats %}
                        {% set ns = namespace(has_items=false) %}
                        {% for proc_name, price in (treatment_prices.items() if treatment_prices else []) %}
                            {% set item_detail = details_map.get(proc_name, {}) %}
                            {% set item_cat = item_detail.get('category', 'إجراءات عامة وأخرى') %}
                            {% if item_cat == cat or (cat == 'إجراءات عامة وأخرى' and item_cat not in defined_cats) %}
                                {% set ns.has_items = true %}
                            {% endif %}
                        {% endfor %}
                        {% if ns.has_items %}
                        <optgroup label="── {{ cat }} ──" data-group-category="{{ cat }}">
                            {% for proc_name, price in (treatment_prices.items() if treatment_prices else []) %}
                                {% set item_detail = details_map.get(proc_name, {}) %}
                                {% set item_cat = item_detail.get('category', 'إجراءات عامة وأخرى') %}
                                {% if item_cat == cat or (cat == 'إجراءات عامة وأخرى' and item_cat not in defined_cats) %}
                                    {% set dur = item_detail.get('duration', 30) %}
                                    <option value="{{ proc_name }}" data-category="{{ item_cat }}" data-duration="{{ dur }}" data-price="{{ price }}" {% if appointment and appointment.reason == proc_name %}selected{% endif %}>{{ proc_name }} ({{ price | format_price }} {{ currency_symbol }})</option>
                                {% endif %}
                            {% endfor %}
                        </optgroup>
                        {% endif %}
                    {% endfor %}
                    <option value="__custom__" class="fw-bold text-primary" {% if appointment and appointment.reason and appointment.reason not in (treatment_prices.keys() if treatment_prices else []) %}selected{% endif %}>-- {% if current_lang == 'ar' %}سبب آخر / إجراء مخصص غير مدرج...{% else %}Other / Custom Reason...{% endif %} --</option>
                </select>

                <!-- Custom Unlisted Procedure Box -->
                <div class="col-12 mt-3" id="custom_reason_container" style="display: none;">
                    <div class="card p-4 rounded-4 shadow-sm custom-proc-card">
                        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom border-secondary border-opacity-25">
                            <h6 class="fw-bold mb-0 text-info d-flex align-items-center gap-2">
                                <i class="bi bi-pencil-square fs-5"></i>
                                {% if current_lang == 'ar' %}تفاصيل الإجراء النصي المخصص الجديد{% else %}Custom Procedure Details{% endif %}
                            </h6>
                            <button type="button" class="btn-close" onclick="toggleCustomReasonInput()" aria-label="Close"></button>
                        </div>

                        <div class="row g-3">
                            <div class="col-md-12 mb-2">
                                <label for="custom_reason" class="form-label small fw-bold mb-1.5 text-body-secondary">
                                    <i class="bi bi-input-cursor-text me-1 text-info"></i>{% if current_lang == 'ar' %}اسم الإجراء / الخدمة المخصصة{% else %}Procedure Name{% endif %}
                                </label>
                                <input type="text" id="custom_reason" name="custom_reason" class="form-control fw-bold py-2" placeholder="{% if current_lang == 'ar' %}مثال: استشارة قبل زراعة عظام أسنان{% else %}e.g. Pre-implant consultation{% endif %}">
                            </div>

                            <div class="col-md-4">
                                <label for="custom_reason_category" class="form-label small fw-bold mb-1.5 text-body-secondary">
                                    <i class="bi bi-tags me-1 text-info"></i>{% if current_lang == 'ar' %}التخصص / التصنيف{% else %}Category{% endif %}
                                </label>
                                <select id="custom_reason_category" name="custom_reason_category" class="form-select py-2">
                                    <option value="فحص وتشخيص">فحص وتشخيص</option>
                                    <option value="حشوات ومعالجات تجميلية">حشوات ومعالجات تجميلية</option>
                                    <option value="علاج عصب وجذور">علاج عصب وجذور</option>
                                    <option value="جراحة وقلع">جراحة وقلع</option>
                                    <option value="تعويضات وتيجان">تعويضات وتيجان</option>
                                    <option value="تقويم أسنان">تقويم أسنان</option>
                                    <option value="أسنان أطفال">أسنان أطفال</option>
                                    <option value="إجراءات عامة وأخرى" selected>إجراءات عامة وأخرى</option>
                                </select>
                            </div>

                            <div class="col-md-4">
                                <label for="custom_reason_duration" class="form-label small fw-bold mb-1.5 text-body-secondary">
                                    <i class="bi bi-clock me-1 text-info"></i>{% if current_lang == 'ar' %}المدة المتوقعة (بالدقائق){% else %}Duration (min){% endif %}
                                </label>
                                <input type="number" id="custom_reason_duration" name="custom_reason_duration" class="form-control fw-bold py-2" value="30" min="5" max="300" step="5" onchange="onCustomDurationChange(this)">
                            </div>

                            <div class="col-md-4">
                                <label for="custom_reason_price" class="form-label small fw-bold mb-1.5 text-body-secondary">
                                    <i class="bi bi-cash-stack me-1 text-info"></i>{% if current_lang == 'ar' %}التكلفة / السعر ({{ currency_symbol }}){% else %}Price{% endif %}
                                </label>
                                <input type="number" id="custom_reason_price" name="custom_reason_price" class="form-control fw-bold py-2" placeholder="0" value="0">
                            </div>

                            <div class="col-12 mt-3 pt-2.5 border-top border-secondary border-opacity-25 d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
                                <div id="custom_proc_confirmed_status" class="fw-bold small text-success d-none align-items-center gap-1.5 p-2 rounded-3" style="background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);">
                                    <i class="bi bi-check-circle-fill fs-5 text-success"></i>
                                    <span id="custom_proc_confirmed_msg"></span>
                                </div>
                                <button type="button" class="btn-confirm-custom-proc ms-auto d-flex align-items-center gap-2" onclick="confirmCustomProcedureCard()">
                                    <i class="bi bi-check-circle-fill"></i>
                                    <span>{% if current_lang == 'ar' %}تأكيد واعتماد الإجراء المخصص{% else %}Confirm Custom Procedure{% endif %}</span>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Attending Doctor Select -->
        <div class="col-md-12">
            <label for="doctor_id" class="form-label">{% if current_lang == 'ar' %}الطبيب المعالج{% else %}Doctor{% endif %}</label>
            <select id="doctor_id" name="doctor_id" class="form-select">
                <option value="">{% if current_lang == 'ar' %}أي طبيب متاح{% else %}Any Available Doctor{% endif %}</option>
                {% for doc in (doctors or all_doctors) %}
                <option value="{{ doc.id }}">{{ doc.display_name }}</option>
                {% endfor %}
            </select>
        </div>

        <!-- Appointment Status -->
        <div class="col-md-12">
            <label class="form-label">{% if current_lang == 'ar' %}حالة الموعد{% else %}Status{% endif %}</label>
            <div class="form-control readonly-status-field">
                {% if current_lang == 'ar' %}مؤكد / مجدول{% else %}Scheduled{% endif %}
            </div>
        </div>

        <!-- Submit & Actions -->
        <div class="col-12 text-center pt-2">
            <button type="submit" class="save-patient-btn">
                <i class="bi bi-check2-circle"></i>
                <span>{% if current_lang == 'ar' %}حفظ الموعد{% else %}Save Appointment{% endif %}</span>
            </button>
            <a href="{{ next_url or request.referrer or (url_for('patients.patient_detail', patient_id=patient.id) if patient else url_for('appointments.appointments')) }}"
                class="btn-outline-main ms-2">
                <i class="bi bi-arrow-right"></i>
                <span>{% if current_lang == 'ar' %}عودة{% else %}Back{% endif %}</span>
            </a>
        </div>

    </div>
</form>
