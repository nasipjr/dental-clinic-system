<!-- ═══════════════════════════════════════════
     Edit Expense Modal
     ═══════════════════════════════════════════ -->
<div class="modal fade" id="editExpenseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 rounded-4 shadow" style="background:var(--surface-color);">
            <div class="modal-header border-bottom border-secondary border-opacity-10 pb-3">
                <h5 class="modal-title fw-bold">
                    <i class="bi bi-pencil-square text-primary me-2"></i>
                    {% if current_lang == 'ar' %}تعديل المصروف{% else %}Edit Expense{% endif %}
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form method="POST" action="" id="edit-expense-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="modal-body py-4">
                    <div class="mb-3">
                        <label for="edit-expense-category" class="form-label fw-semibold text-secondary small">{% if current_lang == 'ar' %}فئة المصروف{% else %}Category{% endif %}</label>
                        <select name="category" id="edit-expense-category" class="form-select rounded-3 border-secondary-subtle" required>
                            <option value="Materials">{% if current_lang == 'ar' %}مواد طبية{% else %}Medical Materials{% endif %}</option>
                            <option value="Rent">{% if current_lang == 'ar' %}إيجار العيادة{% else %}Rent{% endif %}</option>
                            <option value="Salaries">{% if current_lang == 'ar' %}رواتب وأجور{% else %}Salaries{% endif %}</option>
                            <option value="Other">{% if current_lang == 'ar' %}أخرى{% else %}Other / General{% endif %}</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="edit-expense-amount" class="form-label fw-semibold text-secondary small">{% if current_lang == 'ar' %}قيمة المصروف{% else %}Amount{% endif %}</label>
                        <div class="input-group">
                            <input type="number" step="0.01" name="amount" id="edit-expense-amount" class="form-control rounded-start-3" required>
                            <span class="input-group-text rounded-end-3 bg-secondary-subtle text-secondary small">{{ currency_symbol }}</span>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="edit-expense-date" class="form-label fw-semibold text-secondary small">{% if current_lang == 'ar' %}تاريخ المصروف{% else %}Expense Date{% endif %}</label>
                        <input type="date" name="expense_date" id="edit-expense-date" class="form-control rounded-3" required>
                    </div>
                    <div class="mb-3">
                        <label for="edit-expense-notes" class="form-label fw-semibold text-secondary small">{% if current_lang == 'ar' %}ملاحظات وتفاصيل{% else %}Notes{% endif %}</label>
                        <textarea name="notes" id="edit-expense-notes" class="form-control rounded-3" rows="3"></textarea>
                    </div>
                </div>
                <div class="modal-footer border-top border-secondary border-opacity-10 pt-3">
                    <button type="button" class="btn btn-secondary rounded-pill px-4" data-bs-dismiss="modal">{% if current_lang == 'ar' %}إلغاء{% else %}Cancel{% endif %}</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-bold">
                        <i class="bi bi-save me-1"></i>{% if current_lang == 'ar' %}حفظ التعديلات{% else %}Save Changes{% endif %}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
