{% extends "portal/base.html" %}

{% block content %}
<!-- Portal Stylesheet -->
<link rel="stylesheet" href="{{ url_for('static', filename='css/portal_dashboard.css') }}">

<!-- FullCalendar Integration -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Header & Legend Section -->
{% include "portal/sections/_section_portal_book_header.html" %}

<!-- Calendar Container Section -->
{% include "portal/sections/_section_portal_book_calendar.html" %}

<!-- Portal Dashboard Core Controller (Shared Calendar Engine) -->
<script src="{{ url_for('static', filename='js/portal_dashboard_core.js') }}"></script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    window.initPortalDashboard({
        portalDashboardUrl: "{{ url_for('portal.dashboard') }}",
        bookAppointmentUrl: "{{ url_for('portal.book_appointment') }}",
        eventsUrl: "{{ url_for('portal.portal_events') }}",
        bookingWindowDays: {{ booking_window_days | tojson }},
        workingHoursStart: {{ working_hours_start | tojson }},
        workingHoursEnd: {{ working_hours_end | tojson }},
        workingDays: {{ working_days | tojson }},
        defaultDuration: {{ default_appointment_duration | tojson }},
        currentLang: {{ current_lang | tojson }},
        isArabic: {{ (current_lang == 'ar') | tojson }},
        reasons: {{ reasons | tojson }},
        doctorsList: [
            {% for doc in (doctors or all_doctors) %}
            { id: {{ doc.id | tojson }}, name: {{ doc.display_name | tojson }} },
            {% endfor %}
        ]
    });
});
</script>
{% endblock %}
